<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1a6b3c;--green-mid:#2d8f54;--green-light:#e8f5ee;
  --pitch:#0f5c2e;--gold:#f0a500;--bronze:#c47a3a;
  --bg:#f5f7f4;--text:#1a2014;--text-muted:#5a6b52;
  --border:#d4dece;--card:#ffffff;--us-bg:#e8f0fb;--us-text:#1a5c2e;
  --live-red:#e02020;--live-bg:#fff0f0;
}
body{font-family:"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.header{background:var(--pitch);padding:0;position:relative;overflow:hidden}
.header::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 1px,transparent 1px,transparent 40px),
             repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 1px,transparent 1px,transparent 40px);
  z-index:0}
.header-inner{position:relative;width:100%;max-width:760px;margin:0 auto;display:flex;align-items:stretch;z-index:1}
.header-text{padding:18px 20px 22px;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
@media(max-width:500px){
  .header-title{font-size:clamp(15px,4.5vw,22px);white-space:normal}
  .header-text{padding:14px 14px 20px}
  .match-team-logo{width:46px;height:46px;font-size:13px}
  .match-team-name{font-size:12px}
}
.header-eyebrow{font-family:"Barlow Condensed",sans-serif;font-size:11px;letter-spacing:.15em;color:rgba(255,255,255,.5);text-transform:uppercase;margin-bottom:6px}
.header-title{font-family:"Barlow Condensed",sans-serif;font-size:clamp(18px,5vw,28px);font-weight:700;color:#fff;line-height:1.2;margin-bottom:10px}
.header-title span{color:var(--gold)}
.live-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(240,165,0,.18);border:1px solid rgba(240,165,0,.5);color:var(--gold);font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.1em;padding:3px 10px;border-radius:20px;align-self:flex-start}
.live-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.main{max-width:760px;margin:0 auto;padding:18px 16px 40px}

/* Page tabs */
.page-tabs{display:flex;gap:8px;margin-bottom:14px}
.page-tab{flex:1;text-align:center;font-family:"Barlow Condensed",sans-serif;font-size:14px;letter-spacing:.08em;font-weight:700;padding:10px 8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text-muted);cursor:pointer;transition:all .15s}
.page-tab.active{background:var(--pitch);color:#fff;border-color:var(--pitch)}
.page{display:none}
.page.active{display:block}

.section-label{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.section-label::after{content:"";flex:1;height:1px;background:var(--border)}

.group-heading{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:700;color:var(--green);margin:24px 0 8px;display:flex;align-items:center;gap:8px}
.group-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;background:var(--pitch);color:#fff;font-size:14px;font-weight:700}

.matches-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.matches-grid{grid-template-columns:1fr}}

.match-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;transition:border-color .2s,background .2s}
.match-card.is-live{border-color:var(--live-red)}
.status-badge{display:inline-flex;align-items:center;gap:4px;font-family:"Barlow Condensed",sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em}
.status-pre{color:var(--text-muted)}
.status-soon{color:#b8860b}
.status-soon::before{content:"";width:6px;height:6px;border-radius:50%;background:#b8860b;animation:pulse 1.2s ease-in-out infinite;display:inline-block;margin-right:2px}
.status-finished{color:var(--text-muted)}
.match-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.match-time{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.05em;color:var(--text-muted)}
.live-badge{display:inline-flex;align-items:center;gap:4px;font-family:"Barlow Condensed",sans-serif;font-size:12px;font-weight:700;color:var(--live-red);letter-spacing:.05em}
.live-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live-red);animation:pulse 1.2s ease-in-out infinite}

.match-row{display:flex;align-items:center;justify-content:space-between;gap:4px}
.match-team-block{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0}
.match-team-logo{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.match-team-name{font-size:11px;font-weight:500;color:var(--text);text-align:center;line-height:1.2;word-break:keep-all}
.score-box{display:flex;align-items:center;gap:3px;flex-shrink:0}
.score-input{width:34px;height:34px;text-align:center;font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:700;border:1.5px solid var(--border);border-radius:6px;background:#fafbf9;color:var(--text);transition:border-color .15s}
.score-input:focus{outline:none;border-color:var(--green-mid)}
.score-input:not(:placeholder-shown){background:var(--green-light);border-color:var(--green-mid)}
.score-sep{font-family:"Barlow Condensed",sans-serif;font-size:16px;color:var(--text-muted)}

.standings-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.standings-table{width:100%;border-collapse:collapse;font-size:13px}
.standings-table thead{background:var(--pitch)}
.standings-table thead th{font-family:"Barlow Condensed",sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.65);padding:9px 6px;text-align:center;font-weight:600}
.standings-table thead th.col-team{text-align:left;padding-left:10px}
.standings-table tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
.standings-table tbody tr:last-child{border-bottom:none}
.standings-table tbody tr:hover{background:#f8faf7}
.standings-table td{padding:9px 6px;text-align:center;color:var(--text)}
.standings-table td.col-team{text-align:left;padding-left:10px}
.rank-cell{width:30px}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:700}
.r1{background:var(--gold);color:#3d2800}
.r2{background:#c8d0d8;color:#2a3540}
.r3{background:var(--bronze);color:#3d1a00}
.r-other{background:#eaede7;color:var(--text-muted)}
.team-cell-inner{display:flex;align-items:center;gap:8px}
.team-logo-sm{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.team-name-cell{font-weight:500;font-size:13px}
.pts-cell{font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:700;color:var(--green)}
.gd-pos{color:var(--green-mid);font-weight:500}
.gd-neg{color:#c0392b;font-weight:500}

.tb-notes{margin-top:10px}
.tb-note{font-size:11px;color:var(--text-muted);background:#fffbf0;border-left:3px solid var(--gold);padding:6px 10px;border-radius:0 6px 6px 0;margin-bottom:6px}

.reset-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-muted);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;background:transparent;transition:background .1s}
.reset-btn:hover{background:var(--green-light);border-color:var(--green-mid);color:var(--green)}

.footer{text-align:center;font-size:11px;color:var(--text-muted);padding:24px 0 36px;border-top:1px solid var(--border);margin-top:28px}
.footer-copy{font-size:10px;color:var(--text-muted);line-height:1.8;letter-spacing:.03em}
@media(max-width:520px){
  .standings-table .hide-sp{display:none}
  .standings-table td,.standings-table th{padding:7px 3px}
}

.input-locked{pointer-events:none}
.lock-overlay{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.lock-btn{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.05em;border:1px solid var(--border);border-radius:6px;padding:5px 14px;cursor:pointer;background:transparent;color:var(--text-muted);transition:background .1s}
.lock-btn:hover{background:var(--green-light);border-color:var(--green-mid);color:var(--green)}
.lock-status{font-size:11px;color:var(--text-muted);font-family:"Barlow Condensed",sans-serif;letter-spacing:.05em}
.lock-status.unlocked{color:var(--green-mid)}

.ticker-wrap{background:#0f5c2e;border-radius:8px;overflow:hidden;display:flex;align-items:center;height:38px;margin-bottom:16px}
.ticker-label{background:#f0a500;color:#3d2800;font-family:"Barlow Condensed",sans-serif;font-size:11px;font-weight:600;padding:0 12px;height:100%;display:flex;align-items:center;white-space:nowrap;flex-shrink:0;letter-spacing:.08em}
.ticker-track{flex:1;overflow:hidden;position:relative;height:100%}
.ticker-inner{display:inline-flex;align-items:center;height:38px;white-space:nowrap;animation:none}
.ticker-item{display:inline-flex;align-items:center;gap:6px;padding:0 18px;font-size:12px;font-weight:500;color:#fff;border-right:1px solid rgba(255,255,255,.15);height:100%;font-family:"Noto Sans JP",sans-serif}
.ticker-badge{font-size:10px;padding:1px 7px;border-radius:4px;font-weight:500;font-family:"Barlow Condensed",sans-serif;letter-spacing:.05em}
.tb-gold{background:#f0a500;color:#3d2800}
.tb-silver{background:#c8d0d8;color:#2a3540}
.tb-bronze{background:#c47a3a;color:#3d1a00}
.tb-green{background:#2d8f54;color:#e8f5ee}
.tb-red{background:#a32d2d;color:#fcebeb}
.tb-warn{background:#e67e22;color:#fff}
.tb-gray{background:rgba(255,255,255,.2);color:#fff}
.tb-blue{background:#185fa5;color:#e6f1fb}

/* Ticker input */
.ticker-input-wrap{display:flex;gap:6px;margin-bottom:10px}
.ticker-input-wrap input{flex:1;font-size:12px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-family:"Noto Sans JP",sans-serif}
.ticker-input-wrap button{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.05em;border:1px solid var(--border);border-radius:6px;padding:5px 14px;cursor:pointer;background:var(--green);color:#fff}
.ticker-list{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.ticker-list-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px}
.ticker-list-item button{background:transparent;border:none;color:#c0392b;cursor:pointer;font-size:14px}

.day2-note{font-size:11px;color:var(--text-muted);background:#fffbf0;border-left:3px solid var(--gold);padding:6px 10px;border-radius:0 6px 6px 0;margin:8px 0}

.overall-table{width:100%;border-collapse:collapse;font-size:13px}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="header-text">
      <div class="header-eyebrow">2026/6/25-26 ｜ GLOBAL ARENA</div>

  <div class="footer">

function getJST(){
  return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));
}

function getMatchStatus(koH,koM,dateObj){
  const jst=getJST();
  const koMin=koH*60+koM;
  const isMatchDay = jst.getFullYear()===dateObj.year&&jst.getMonth()+1===dateObj.month&&jst.getDate()===dateObj.day;
  const isAfterMatchDay = jst.getFullYear()>dateObj.year||
    (jst.getFullYear()===dateObj.year&&jst.getMonth()+1>dateObj.month)||
    (jst.getFullYear()===dateObj.year&&jst.getMonth()+1===dateObj.month&&jst.getDate()>dateObj.day);
  if(isAfterMatchDay) return 'finished';
  if(isMatchDay){
    const nowMin=jst.getHours()*60+jst.getMinutes();
    if(nowMin >= koMin + LIVE_AFTER) return 'finished';
    if(nowMin >= koMin - LIVE_BEFORE) return 'live';
    if(nowMin >= koMin - 5) return 'soon';
    return 'pre';
  }
  return 'pre';
}

// ── Standings calculation ───────────────────────────────────────────────────
function buildH2H(matches){
  const map={};
  matches.forEach(m=>{
    const s=getScore(m.id); if(!s) return;
    const {home:h, away:a}=m;
    for(const[t1,t2]of[[h,a],[a,h]]){if(!map[t1])map[t1]={};if(!map[t1][t2])map[t1][t2]={pts:0,gf:0,ga:0};}
    map[h][a].gf+=s.h; map[h][a].ga+=s.a; map[a][h].gf+=s.a; map[a][h].ga+=s.h;
    if(s.h>s.a){map[h][a].pts+=3;}else if(s.h<s.a){map[a][h].pts+=3;}else{map[h][a].pts+=1;map[a][h].pts+=1;}
  });
  return map;
}

function calcGroupStandings(teams, matches){
  const teamObjs={};
  teams.forEach(name=>teamObjs[name]={name,pts:0,played:0,w:0,d:0,l:0,gf:0,ga:0});
  matches.forEach(m=>{
    const s=getScore(m.id); if(!s) return;
    const ht=teamObjs[m.home], at=teamObjs[m.away];
    if(!ht||!at) return;
    ht.gf+=s.h; ht.ga+=s.a; ht.played++;
    at.gf+=s.a; at.ga+=s.h; at.played++;
    if(s.h>s.a){ht.w++;ht.pts+=3;at.l++;}
    else if(s.h<s.a){at.w++;at.pts+=3;ht.l++;}
    else{ht.d++;ht.pts+=1;at.d++;at.pts+=1;}
  });
  const h2h=buildH2H(matches);
  const arr=Object.values(teamObjs).map(t=>({...t,gd:t.gf-t.ga}));
  arr.sort((a,b)=>b.pts-a.pts);
  const groups=[]; let i=0;
  while(i<arr.length){let j=i;while(j<arr.length&&arr[j].pts===arr[i].pts)j++;groups.push(arr.slice(i,j));i=j;}
  const notes=[], sorted=[];
  for(const grp of groups){
    if(grp.length===1){sorted.push(grp[0]);continue;}
    grp.sort((a,b)=>{
      const ns=grp.map(x=>x.name);
      const hp=t=>ns.reduce((s,n)=>n!==t.name?(h2h[t.name]?.[n]?.pts||0)+s:s,0);
      if(hp(b)!==hp(a))return hp(b)-hp(a);
      if(b.gd!==a.gd)return b.gd-a.gd;
      if(b.gf!==a.gf)return b.gf-a.gf;
      return 0;
    });
    const ns=grp.map(x=>x.name).join('・');
    const nms=grp.map(x=>x.name);
    const hpL=grp.map(t=>nms.reduce((s,n)=>n!==t.name?(h2h[t.name]?.[n]?.pts||0)+s:s,0));
    if(new Set(hpL).size>1) notes.push(`⚠️ 【${ns}】同勝点 → 当該チーム間の対戦成績で決定`);
    else if(new Set(grp.map(x=>x.gd)).size>1) notes.push(`⚠️ 【${ns}】同勝点・同当該成績 → 得失点差で決定`);
    else if(new Set(grp.map(x=>x.gf)).size>1) notes.push(`⚠️ 【${ns}】→ 総得点数で決定`);
    else notes.push(`⚠️ 【${ns}】全項目タイ → 抽選で決定`);
    sorted.push(...grp);
  }
  return {sorted, notes};
}

  return matches.every(m=>getScore(m.id)!==null);
}

// ── Day 2 logic ──────────────────────────────────────────────────────────────
// Returns {G1:[team,team,team,team], G2:[...], G3:[...], G4:[...]}
// Index within each pot = day1 rank-1 of source group, in order A,B,C
function getDay2Pots(){
  const pots={G1:[],G2:[],G3:[],G4:[]};
  ['A','B','C'].forEach(g=>{
    const groupMatches=DAY1_MATCHES.filter(m=>m.group===g);
    const {sorted}=calcGroupStandings(DAY1_GROUPS[g], groupMatches);
    sorted.forEach((team,idx)=>{
      const potKey='G'+(idx+1);
      pots[potKey].push(team.name);
    });
  });
  return pots;
}

function getDay2Matches(pots){
  return DAY2_TEMPLATE.map(m=>{
    const teams=pots[m.group]||[];
    return {
      ...m,
      home: teams[m.homeIdx] || null,
      away: teams[m.awayIdx] || null,
    };
  });
}

// Placeholder team labels shown before Day1 standings are confirmed.
// Pot index = day1 rank-1 (0=1st,1=2nd,2=3rd,3=4th) of source group A/B/C, in that order.
const PLACEHOLDER_LABELS = ['Aグループ','Bグループ','Cグループ'];

function getPlaceholderTeams(potRankIdx){
  // potRankIdx: 0 for G1 (1位グループ), 1 for G2, etc.
  const ordinal=['1位','2位','3位','4位'][potRankIdx];
  return PLACEHOLDER_LABELS.map(g=>g+ordinal);
}

function getDay2State(){
  const day1Done=isDay1Complete();
  let pots, day2Matches;
  if(day1Done){
    pots=getDay2Pots();
    day2Matches=getDay2Matches(pots);
  } else {
    pots={
      G1:getPlaceholderTeams(0),
      G2:getPlaceholderTeams(1),
      G3:getPlaceholderTeams(2),
      G4:getPlaceholderTeams(3),
    };
    day2Matches=DAY2_TEMPLATE.map(m=>({
      ...m,
      home: pots[m.group][m.homeIdx],
      away: pots[m.group][m.awayIdx],
    }));
  }
  return {day1Done, pots, day2Matches};
}

// ── Ticker ───────────────────────────────────────────────────────────────────
function renderTicker(){
  const inner=document.getElementById('ticker-inner');
  if(!inner) return;
  if(tickerMessages.length===0){
    inner.innerHTML='<span class="ticker-item">📊 USCUP 2026 ステップアップリーグ戦 開幕！ <span class="ticker-badge tb-blue">注目</span></span>';
    return;
  }
  const html=tickerMessages.map(m=>
    `<span class="ticker-item">📣 ${escapeHtml(m)} <span class="ticker-badge tb-gold">速報</span></span>`
  ).join('');
  inner.innerHTML=html+html;
  if(window._tickerRAF) cancelAnimationFrame(window._tickerRAF);
  window._tickerPos=0;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const half=inner.scrollWidth/2;
    if(half<=0) return;
    function tick(){
      window._tickerPos-=0.6;
      if(window._tickerPos<=-half) window._tickerPos=0;
      inner.style.transform=`translateX(${window._tickerPos}px)`;
      window._tickerRAF=requestAnimationFrame(tick);
    }
    window._tickerRAF=requestAnimationFrame(tick);
  }));
}

function escapeHtml(s){
  const div=document.createElement('div');
  div.textContent=s;
  return div.innerHTML;
}

// ── Lightweight update: recompute standings tables without rebuilding match cards ──
function updateStandingsOnly(){
  ['A','B','C'].forEach(g=>{
    const groupMatches=DAY1_MATCHES.filter(m=>m.group===g);
    const {sorted, notes}=calcGroupStandings(DAY1_GROUPS[g], groupMatches);

      renderStandingsTable(sorted, notes, 'standings-'+g, 'notes-'+g);

      _lastDay1Done=day1Done;
      renderDay2();

      updateDay2StandingsAndOverall();
    }
  }
  renderTicker();
  renderTickerList();
}

    const pw=prompt('パスワードを入力してください：');
    if(pw && pw.trim().toLowerCase()===PASSWORD){
      isUnlocked=true;
      document.querySelectorAll('.matches-grid').forEach(g=>g.classList.remove('input-locked'));
      document.getElementById('ticker-input').disabled=false;
      document.querySelector('.ticker-input-wrap button').disabled=false;
      document.getElementById('lock-status').textContent='🔓 入力モード（Hiro）';
      document.getElementById('lock-status').className='lock-status unlocked';
      document.getElementById('lock-btn').textContent='ロック';
    } else if(pw!==null){
      alert('パスワードが違います');
    }
  }
}

function resetAll(){
  const pw=prompt('パスワードを入力してください：');
  if(!pw||pw.trim().toLowerCase()!==PASSWORD){
    if(pw!==null) alert('パスワードが違います');
    return;
  }
  if(!confirm('全てのスコアと速報をリセットしますか？')) return;
  SCORES={};
  tickerMessages=[];
  renderAll();
  fetch(FIREBASE_URL+FB_PATH+'/scores.json',{method:'DELETE'}).catch(e=>console.error(e));
  fetch(FIREBASE_URL+FB_PATH+'/ticker.json',{method:'DELETE'}).catch(e=>console.error(e));
}

// ── Live status refresh ──────────────────────────────────────────────────────
function refreshLive(){
  let changed=false;
  const statusClassMap={pre:'is-prematch',soon:'is-soon',live:'is-live',finished:'is-finished'};
  document.querySelectorAll('.match-card').forEach(card=>{
    const id=card.id.replace('card-','');
    let m=DAY1_MATCHES.find(x=>x.id===id);
    let dateObj=MATCH_DATE;
    if(!m){
      m=DAY2_TEMPLATE.find(x=>x.id===id);
      dateObj=MATCH_DATE_DAY2;
    }
    if(!m) return;
    const status=getMatchStatus(m.koH,m.koM,dateObj);
    if(!card.classList.contains(statusClassMap[status])) changed=true;
  });
  if(changed) renderAll();
}

// ── Master render ────────────────────────────────────────────────────────────
function renderAll(){
  renderDay1();
  if(currentPage==='day2') renderDay2();
  renderTicker();
  renderTickerList();
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init(){
  document.querySelectorAll('.matches-grid').forEach(g=>g.classList.add('input-locked'));
  document.getElementById('ticker-input').disabled=true;
  await loadScores();
  await loadTicker();
  _lastDay1Done=isDay1Complete();
  renderAll();
  startPolling();
  setInterval(refreshLive, 30000);
}
init();

</script>
